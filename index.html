<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body> 
    <!-- Ambient Background Orbs -->
     <div class="orb orb-1"></div>
     <div class="orb orb-2"></div>

    <!-- Calculator Card -->
     <div class="calculator">
        <!-- Top Display -->
         <div class="display">
            <div class="history" id="history"></div>
            <div class="output" id="output">0</div>
         </div>

         <!-- Keypad Grid   -->
          <div class="keys" id="keys">
            <button class="btn fn" data-act="clear" data-k="Escape">AC</button>
            <button class="btn fn" data-k="Backspace">DEL</button>
            <button class="btn fn" data-act="pct" data-k="Backspace">%</button>
            <button class="btn op" data-op="/" data-k="/">/</button>
            <button class="btn" data-num="7" data-k="7">7</button>
            <button class="btn" data-num="8" data-k="8">8</button>
            <button class="btn" data-num="9" data-k="9">9</button>

            <button class="btn op" data-op="" data-k="">*</button>
            <button class="btn" data-num="4" data-k="4">4</button>
            <button class="btn" data-num="5" data-k="5">5</button>
            <button class="btn" data-num="6" data-k="6">6</button>

            <button class="btn op" data-op="-" data-k="-">-</button>
            <button class="btn" data-num="1" data-k="1">1</button>
            <button class="btn" data-num="2" data-k="2">2</button>
            <button class="btn" data-num="3" data-k="7">3</button>

            <button class="btn op" data-op="+" data-k="+">+</button>
            <button class="btn" data-act="sign">+_</button>
            <button class="btn" data-num="0" data-k="0">0</button>

            <button class="btn" data-num="." data-k=".">.</button>
            <button class="btn eq" data-act="eq" data-k="Enter">=</button>
          </div>
     </div>
     <script src="script.js"></script>
</body>
</html>
